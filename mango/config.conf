###############################################################################
# Appearance
###############################################################################

tag_num=9                           # number of workspaces

cursor_size=24
cursor_theme=Adwaita

gap_inner_horizontal = 22
gap_inner_vertical   = 22
gap_outer_horizontal = 22
gap_outer_vertical   = 20
smart_gaps=0

border_px=2
border_radius=12
no_border_when_single=0
no_radius_when_single=0
enable_border_resize=0          # disable resizing windows with the mouse

# colors follow the schema 0xRRBBGGAA
root_color=0x1D2021FF
border_color=0x282828FF
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xFE8019ff
maximized_screen_color=0x8EC07CFF
urgent_color=0xCFB4934FF
global_color=0x8F3F71FF

# Misc
focus_on_activate=0             # do not auto-focus windows (e.g. when clicking links)
sloppy_focus=0                  # focus follows mouse
warp_cursor=1                   # mouse follows focus
focus_cross_monitor=0           # do not jump to next monitor when cycling focus
focus_cross_tag=0               # do not jump to next tag when cycling focus
enable_floating_snap=1          # snap floating windows
snap_distance=30
drag_tile_to_tile=1             # swap window positions by dragging them ontop of each other
drag_tile_small=0               # do not change window size when dragging

# disallow programs from bypassing vsync, check how this behaves otherwise set to 1 or remove
allow_tearing=0


###############################################################################
# Window effects
###############################################################################

blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 1
blur_params_radius = 4
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

# settings to dim unfocused windows
dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# settings to change the opacity of (un)focused windows
focused_opacity=1.0
unfocused_opacity=1.0

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=200
animation_duration_focus=100
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1


###############################################################################
# Layout settings
###############################################################################

# tiling (master <-> stack) layout setting
new_is_master=1
default_master_factor=0.5
default_master_count=1

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# tab bar for the monocle layout
tab_bar_height = 35
tab_bar_decorate_fg_color = 0xD5C4A1FF
tab_bar_decorate_bg_color = 0x1D2021FF
tab_bar_decorate_focus_fg_color = 0xFE8019ff
tab_bar_decorate_focus_bg_color = 0x32302FFF
tab_bar_decorate_border_color = 0xFE8019ff
tab_bar_decorate_border_width = 2
tab_bar_decorate_corner_radius = 5
tab_bar_decorate_font_desc = "Roboto Mono Nerd Font Mono Medium 11"


###############################################################################
# Input Devices
###############################################################################

# keyboard
repeat_rate=80
repeat_delay=300
numlock_on=0
xkb_rules_layout=us
xkb_rules_variant=altgr-intl
xkb_rules_options=caps:none

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
swipe_min_threshold=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
trackpad_scroll_factor=1.0
trackpad_scroll_method=1

# mouse
mouse_natural_scrolling=0
mouse_accel_profile=0
disable_middle_paste=1      # disable middle click pasting


###############################################################################
# Rules
###############################################################################

# Laptop
monitor_rule=make:Chimei Innolux Corporation,model:0x140A,width:1980,height:1080,refresh:60.0,x:0,y:0,scale:1
# 24 inch Dell monitor
monitor_rule=make:Dell Inc.,model:DELL S2240L,width:1980,height:1080,refresh:60.0,x:0,y:0,scale:1
# 27 inch Lenovo monitor
monitor_rule=make:Lenovo Group Limited,model:LEN L27q-10,width:2560,height:1440,refresh:59.951,x:1980,y:0,scale:1.1,primary:1

# apply tiling layout to all tags by default
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# use zoom animation when rofi starts
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# set PCManFM to always float
window_rule=is_floating:1,animation_type_open:zoom,animation_type_close:zoom,app_id:pcmanfm
# Faugus is floating anyways, make it explicit
window_rule=is_floating:1,app_id:io.github.Faugus.faugus-launcher
# specific settings for Mod Organizer 2 running inside a Proton prefix
window_rule=is_floating:1,no_animation:1,animation_type_open:none,animation_type_close:none,no_fade_in:1,no_fade_out:1,app_id:steam_app_default


###############################################################################
# Key Bindings
# Mod Keys: SUPER,CTRL,ALT,SHIFT,NONE
###############################################################################

auto_reload_config=0                            # do not restart Mango on config change
bind=SUPER+SHIFT,r,reload_config                # reload config
bind=SUPER+SHIFT,q,quit                         # quit Mango
bind=SUPER,c,killclient                         # close focused application
bind=SUPER,tab,switcher,all_next                # open windows-style application switcher

bind=SUPER,Return,spawn,alacritty               # alacritty
bind=SUPER,space,spawn,rofi -show drun          # rofi
bind=SUPER,b,spawn,librewolf                    # librewolf
bind=SUPER,e,spawn,pcmanfm                      # pcmanfm

bind=SUPER,j,focusstack,next                    # focus next window in the stack
bind=SUPER,k,focusstack,previous                # focus previous window in the stack
bind=SUPER+SHIFT,j,exchange_stack_client,next   # exchange with next window in the stack
bind=SUPER+SHIFT,k,exchange_stack_client,prev   # exchange with previous window in the stack
bind=SUPER+CTRL,j,focusmon,next                 # focus next next monitor
bind=SUPER,o,tagmon,next                        # move focused window to next monitor

bind=SUPER+SHIFT,space,togglefloating           # toggle floating
bind=SUPER,p,toggle_all_floating                # toggle entire workspace floating (only current windows)
bind=SUPER,f,togglemaximizescreen               # span window across entire window space
bind=SUPER,g,toggleglobal                       # mark window as global

circle_layout=tile,monocle                      # list of enabled layouts
bind=SUPER,n,switch_layout                      # cycle between layouts

bind=SUPER,l,setmfact,+0.05                     # increase width of windows when tiled
bind=SUPER,h,setmfact,-0.05                     # decrease width of windows when tiled

# jump between workspaces
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# move client to the tag and focus it (use tagsilent to move without following focus)
bind=SUPER+shift,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Move window (enables floating is window is currently tiled)
bind=SUPER,Up,movewin,+0,-50
bind=SUPER,Down,movewin,+0,+50
bind=SUPER,Left,movewin,-50,+0
bind=SUPER,Right,movewin,+50,+0

# Resize floating windows
bind=SUPER+SHIFT,Up,resizewin,+0,-50
bind=SUPER+SHIFT,Down,resizewin,+0,+50
bind=SUPER+SHIFT,Left,resizewin,-50,+0
bind=SUPER+SHIFT,Right,resizewin,+50,+0

mousebind=SUPER,btn_left,moveresize,curmove         # SUPER + left mouse to move window
mousebind=SUPER,btn_right,moveresize,curresize      # SUPER + right mouse to resize window

# audio control
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# music playback control using playerctl (requires an MPRIS capable player)
bind=NONE,XF86AudioMedia,spawn,playerctl play-pause
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next

# brightness control
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# screenshots
bind=NONE,Print,spawn,noctalia msg screenshot-fullscreen
bind=SHIFT,Print,spawn,noctalia msg screenshot-region


###############################################################################
# Autostart and Environment Variables
###############################################################################

# these are also set in $HOME/.zshenv
env=GTK_THEME,Adwaita:dark
env=QT_STYLE_OVERRIDE,gtk3
env=WLR_RENDERER,vulkan
env=XCURSOR_SIZE,24
env=XCURSOR_THEME,Adwaita

exec_once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec_once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots
exec_once = /usr/lib/xdg-desktop-portal-wlr
exec_once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

exec_once = noctalia
exec_once = udiskie --automount --notify
