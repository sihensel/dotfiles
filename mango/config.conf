# More option see https://github.com/DreamMaoMao/mango/wiki/

tab_bar_height = 35
tab_bar_decorate_fg_color = 0xD5C4A1FF
tab_bar_decorate_bg_color = 0x1D2021FF
tab_bar_decorate_focus_fg_color = 0xFE8019ff
tab_bar_decorate_focus_bg_color = 0x32302FFF
tab_bar_decorate_border_color = 0xFE8019ff
tab_bar_decorate_border_width = 2
tab_bar_decorate_corner_radius = 5
tab_bar_decorate_font_desc = "Roboto Mono Nerd Font Mono Bold 11"

cursor_size=20
cursor_theme=Adwaita

env=WLR_RENDERER,vulkan

# Monitor rules
# Laptop
monitor_rule=make:Chimei Innolux Corporation,model:0x140A,width:1980,height:1080,refresh:60.0,x:0,y:0,scale:1
# 24 inch Dell monitor
monitor_rule=make:Dell Inc.,model:DELL S2240L,width:1980,height:1080,refresh:60.0,x:0,y:0,scale:1
# 27 inch Lenovo monitor
monitor_rule=make:Lenovo Group Limited,model:LEN L27q-10,width:2560,height:1440,refresh:59.951,x:1980,y:0,scale:1.05,primary:1

# disallow programs from bypassing vsync, check how this behaves otherwise set to 1 or remove
allow_tearing=0

disable_middle_paste=1
# disable resizing windows with the mouse
enable_border_resize=0

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 1
blur_params_radius = 4
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=10
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=200
animation_duration_focus=100
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.5
default_master_count=1
tag_num=9
smart_gaps=0
bind=SUPER,l,setmfact,+0.05
bind=SUPER,h,setmfact,-0.05

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=80
repeat_delay=300
numlock_on=0
xkb_rules_layout=us
xkb_rules_variant=altgr-intl
xkb_rules_options=caps:none

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
trackpad_scroll_factor=1.0
# 1 = two-finger
trackpad_scroll_method=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=0

# Appearance
gap_inner_horizontal = 15
gap_inner_vertical   = 15
gap_outer_horizontal = 15
gap_outer_vertical   = 15
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x1D2021FF
border_color=0x1D2021FF
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xFE8019ff
maximized_screen_color=0x8EC07CFF
urgent_color=0xCFB4934FF
scratchpad_color=0x7C6F65FF
global_color=0x8F3F71FF
overlay_color=0x1D2021FF

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config
auto_reload_config=0

# bind=SUPER,s,toggleoverlay

# menu and terminal
bind=SUPER,Return,spawn,alacritty
bind=SUPER,space,spawn,rofi -show drun
# when using the noctalia launcher instead of rofi
# bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,b,spawn,librewolf
bind=SUPER,e,spawn,pcmanfm

# exit
bind=SUPER+SHIFT,q,quit
bind=SUPER,c,killclient,

# switch window focus
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,previous
# bind=SUPER,k,focusdir,left
# bind=SUPER,k,focusdir,right
# bind=ALT,Up,focusdir,up
# bind=ALT,Down,focusdir,down

# move window
bind=SUPER+SHIFT,j,exchange_stack_client,next
bind=SUPER+SHIFT,k,exchange_stack_client,prev
# bind=SUPER+SHIFT,j,move_client,up
# bind=SUPER+SHIFT,k,move_client,down
# bind=SUPER+SHIFT,h,move_client,left
# bind=SUPER+SHIFT,l,move_client,right

bind=SUPER,tab,switcher,all_next

# switch window status
bind=SUPER,g,toggleglobal,
# bind=ALT,Tab,togglejump,
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER,f,togglemaximizescreen,
# bind=SUPER+f,space,togglefullscreen,
# bind=ALT+SHIFT,f,togglefakefullscreen,
#bind=SUPER,i,minimized,
#bind=SUPER,h,toggleoverlay,
#bind=SUPER+SHIFT,I,restore_minimized
#bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
circle_layout=tile,monocle
bind=SUPER,n,switch_layout

# tag switch
# bind=SUPER,Left,viewtoleft,0
# bind=CTRL,Left,viewtoleft_have_client,0
# bind=SUPER,Right,viewtoright,0
# bind=CTRL,Right,viewtoright_have_client,0
# bind=CTRL+SUPER,Left,tagtoleft,0
# bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+shift,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# focus next next monitor
bind=SUPER+CTRL,j,focusmon,next
# move focused window to next monitor
bind=SUPER,o,tagmon,next

# gaps
# bind=ALT+SHIFT,X,incgaps,1
# bind=ALT+SHIFT,Z,incgaps,-1
# bind=ALT+SHIFT,R,togglegaps

# Move window (enables floating is window is currently tiled)
bind=SUPER,Up,movewin,+0,-50
bind=SUPER,Down,movewin,+0,+50
bind=SUPER,Left,movewin,-50,+0
bind=SUPER,Right,movewin,+50,+0

# Resize floating windows
bind=SUPER+SHIFT,Up,resizewin,+0,-50
bind=SUPER+SHIFT,Down,resizewin,+0,+50
bind=SUPER+SHIFT,Left,resizewin,-50,+0
bind=SUPER+SHIFT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# audio control
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Music playback control using playerctl (requires an MPRIS capable player)
bind=NONE,XF86AudioMedia,spawn,playerctl play-pause
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next

# brightness control
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-


# Axis Bindings
# axisbind=SUPER,UP,viewtoleft_have_client
# axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# screenshots
bind=NONE,Print,spawn,noctalia msg screenshot-fullscreen
bind=SHIFT,Print,spawn,noctalia msg screenshot-region

# set environment variables
env=XCURSOR_SIZE,30
env=XCURSOR_THEME,capitaine-cursors
env=GTK_THEME,Adwaita:dark
env=QT_STYLE_OVERRIDE,gtk3

# autostart stuff
exec_once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec_once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots
exec_once = /usr/lib/xdg-desktop-portal-wlr
exec_once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

exec_once = noctalia
exec_once = udiskie --automount --notify
