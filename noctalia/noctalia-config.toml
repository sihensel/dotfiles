[widget.tray]
capsule_border = "hover"

[widget.volume]
capsule_border = "#8EC07C"
color = "#8EC07C"
icon_color = "#8EC07C"

[widget.workspaces]
active_pill_size = 1.2000000000000002
capsule_border = "secondary"
capsule_padding = 10
capsule_radius = 5
empty_color = "on_surface_variant"
focused_color = "secondary"
inactive_pill_size = 1.2000000000000002
occupied_color = "tertiary"
show_labels = false
show_tooltip = false
