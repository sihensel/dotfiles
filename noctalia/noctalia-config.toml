    box_width = 400.0
    cx = 960.0
    cy = 764.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = false
        show_login_button = true
        show_media = true
        show_password_reveal = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

[nightlight]
temperature_day = 6200

[notification]
background_opacity = 0.99999997764825821
border_color = "tertiary"
border_width = 1.5
follow_focused_output = true
offset_y = 20
position = "top_center"

[osd]
background_opacity = 0.99999997764825821
border_color = "tertiary"
border_width = 1.5
follow_focused_output = true

[plugins]
enabled = []

[shell]
app_icon_colorize = false
avatar_path = "/home/simon/wallpapers/GANOO.png"
clipboard_enabled = false
font_family = "Noto Sans"
offline_mode = true
panel_anchor_bar = "default"
show_close_buttons = false
show_location = false

    [shell.animation]
    speed = 1.2000000178813934

    [shell.launcher]
    categories = false
    category_icons_only = true
    compact = true
    default_view = "all"
    fetch_exchange_rates = false
    layout = "simple"
    search_position = "top"
    show_session_button = false
    show_settings_button = false
    track_usage = false

    [shell.panel]
    control_center_placement = "floating"
    floating_offset = 10
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    directory = "/home/simon"

    [shell.session]
    grid = true
    grid_columns = 2
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

    [shell.shadow]
    direction = "down_right"

[system.monitor]
cpu_poll_seconds = 5
disk_poll_seconds = 60
memory_poll_seconds = 5
network_poll_seconds = 5

[theme]
builtin = "Gruvbox"
community_palette = "GitHub Dark"
mode = "dark"
source = "builtin"
wallpaper_scheme = "soft"

[wallpaper]
directory = "/home/simon/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/simon/wallpapers/Games/skyrim-tundra.jpg"

    [wallpaper.last]
    path = "/home/simon/wallpapers/Games/skyrim-tundra.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/simon/wallpapers/Games/skyrim-tundra.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/simon/wallpapers/Games/skyrim-tundra.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/simon/wallpapers/Games/skyrim-tundra.jpg"

    [[wallpaper.favorite]]
    path = "/home/simon/wallpapers/Pfoun/3fdc41d23b6bebeb2a063f43ad1bd57e.jpg"

[weather]
enabled = false
refresh_minutes = 60

[widget.audio_visualizer]
color_1 = "tertiary"
color_2 = "tertiary"
show_when_idle = true

[widget.battery]
capsule_border = "secondary"
color = "secondary"

[widget.bluetooth]
capsule_border = "tertiary"
color = "tertiary"
show_label = true

[widget.brightness]
color = "secondary"

[widget.clock]
capsule_border = "#FE8019"
color = "#FE8019"
format = "{:%a %H:%M}"

    [widget.clock.actions]
    left = "panel-toggle control-center"

[widget.custom_button_2]
color = "#D3869B"
glyph = "music"
icon_color = "#D3869B"
type = "custom_button"

    [widget.custom_button_2.actions]
    left = "panel-open control-center media"

[widget.media]
capsule_border = "#D3869B"
color = "#D3869B"
hide_album_art = true
icon_color = "#D3869B"

[widget.network]
capsule_border = "primary"
color = "primary"
show_vpn_label = true
vpn_status = "both"

[widget.nightlight.actions]
left = "nightlight-force-toggle"

[widget.session]
color = "error"

[widget.sysmon]
