[notification]
background_opacity = 0.99999997764825821
border_color = "tertiary"
border_width = 1.5
follow_focused_output = true
offset_y = 20

[osd]
background_opacity = 0.99999997764825821
border_color = "tertiary"
border_width = 1.5
follow_focused_output = true

[plugins]
enabled = [ "noctalia/timer" ]

[shell]
avatar_path = "/home/simon/wallpapers/GANOO.png"
clipboard_enabled = false
font_family = "Noto Sans"
panel_anchor_bar = "default"
show_close_buttons = false
show_location = false

    [shell.animation]
    speed = 1.2000000178813934

    [shell.launcher]
    default_view = "all"

    [shell.panel]
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    directory = "/home/simon"

    [shell.session]
    grid = true
    grid_columns = 2
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

    [shell.shadow]
    direction = "down_right"

[system.monitor]
cpu_poll_seconds = 5
disk_poll_seconds = 60
memory_poll_seconds = 5
network_poll_seconds = 5

[theme]
builtin = "Gruvbox"
community_palette = "Gruvbox Material Medium"
mode = "dark"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/simon/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/simon/wallpapers/Games/__warcraft_and_2_more_drawn_by_cutesexyrobutts__1220238414b6a4bf426a924ce712dc6b.png"

    [wallpaper.last]
    path = "/home/simon/wallpapers/Games/__warcraft_and_2_more_drawn_by_cutesexyrobutts__1220238414b6a4bf426a924ce712dc6b.png"

    [wallpaper.monitors.DP-2]
    path = "/home/simon/Valpepers/Games/skyrim-tundra.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/simon/Valpepers/Games/skyrim-tundra.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/simon/wallpapers/Games/__warcraft_and_2_more_drawn_by_cutesexyrobutts__1220238414b6a4bf426a924ce712dc6b.png"

[weather]
refresh_minutes = 60

[widget.audio_visualizer]
show_when_idle = true

[widget.battery]
color = "secondary"

[widget.bluetooth]
color = "tertiary"
show_label = true

[widget.brightness]
color = "secondary"

[widget.clock]
color = "secondary"
format = "{:%a %H:%M}"

    [widget.clock.actions]
    left = "panel-toggle control-center"

[widget.media]
hide_album_art = true

[widget.network]
color = "primary"
show_vpn_label = true
vpn_status = "both"

[widget.session]
color = "error"

[widget.sysmon]
stat = "ram_pct"

[widget.volume]
color = "tertiary"
icon_color = "tertiary"

[widget.workspaces]
active_pill_size = 1.75
capsule_padding = 10
capsule_radius = "auto"
empty_color = "shadow"
focused_color = "secondary"
inactive_pill_size = 1.75
occupied_color = "tertiary"
