[audio]
enable_notification_sounds = false
enable_power_sounds = false
enable_screenshot_sounds = false
enable_sounds = false
enable_volume_sounds = false

[bar.default]
background_opacity = 0.0
capsule = true
capsule_fill = "on_primary"
capsule_padding = 7.0
capsule_radius = 6
capsule_thickness = 0.9499999824911356
center = [ "clock" ]
contact_shadow = true
end = [ "tray", "group:g1", "volume", "battery", "bluetooth", "network" ]
font_scale = 1.0999999828636646
margin_edge = 12
margin_ends = 30
margin_opposite_edge = 0
padding = 6
radius = 8
scale = 1.2000000104308128
shadow = false
start = [ "workspaces" ]
thickness = 35
widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "#D3869B"
    border_width = 1.0
    enabled = true
    fill = "on_primary"
    id = "g1"
    members = [ "custom_button_2", "media" ]
    opacity = 1.0
    padding = 7.0
    radius = 6.0

[calendar]

[control_center]
show_session_button = false
sidebar = "full"
sidebar_section = "full"

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "session"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hot_corners]
enabled = true

[idle]
behavior_order = [ "lock", "screen-off" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[location]
address = ""

[lockscreen]
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]

[lockscreen_widgets]
