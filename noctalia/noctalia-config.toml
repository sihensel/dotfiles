[audio]
enable_notification_sounds = false
enable_power_sounds = false
enable_screenshot_sounds = false
enable_sounds = false
enable_volume_sounds = false

[bar.default]
capsule_radius = 5
center = [ "clock", "tray" ]
contact_shadow = true
end = [ "network", "bluetooth", "media", "volume", "battery", "session" ]
font_scale = 1.0999999828636646
margin_edge = 15
margin_ends = 25
margin_opposite_edge = 5
padding = 20
scale = 1.1000000089406967
shadow = false
start = [ "workspaces" ]
thickness = 35
widget_spacing = 15

[calendar]

[control_center]
show_session_button = false

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hot_corners]
enabled = true

[idle]
behavior_order = [ "lock", "screen-off" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[location]
address = "Bietigheim, Germany"

[lockscreen]
